# pi-cage on Kubernetes.
#
# Namespace, identity, storage, workload and Service. NetworkPolicy lives in
# networkpolicy.yaml because it is the boundary and deserves its own file.
#
# Replace the image reference with your own build. No image is published yet.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pi-cage
---
# No token, no RBAC bindings. The agent must never be able to talk to the API
# server: it executes model-authored commands, so cluster credentials in this
# Pod would be a privilege-escalation primitive.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-cage
  namespace: pi-cage
automountServiceAccountToken: false
---
# Pi configuration, credentials (auth.json) and session transcripts (plain
# JSONL). Back this up ENCRYPTED -- it holds provider keys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-cage-home
  namespace: pi-cage
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName is deliberately omitted so the CLUSTER's default class is
  # used. Hard-coding a name here is a trap: a cluster without that class leaves
  # the PVC Pending for ever, the Pod unschedulable, and the failure looks like a
  # scheduling problem rather than a storage one. Set it explicitly only if your
  # cluster has no default class:
  #
  #   storageClassName: <your-rbd-class>
  resources:
    requests:
      storage: 5Gi
---
# The agent's working directory. Single writer, so ReadWriteOnce.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-cage-workspace
  namespace: pi-cage
spec:
  accessModes: [ReadWriteOnce]
  # See the note on pi-cage-home above.
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-cage
  namespace: pi-cage
spec:
  replicas: 1
  # RWO volume: never run two Pods against it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pi-cage
  template:
    metadata:
      labels:
        app: pi-cage
        role: cage
    spec:
      serviceAccountName: pi-cage
      automountServiceAccountToken: false
      # Do NOT remove this. Kubernetes "service links" inject <SERVICE>_PORT,
      # <SERVICE>_SERVICE_HOST and friends into every Pod for every Service in
      # the namespace. The Service below is named pi-cage, so the cluster would
      # set PI_CAGE_PORT=tcp://<clusterIP>:7681 -- which collides with pi-cage's
      # own PI_CAGE_PORT setting and made the container crash on startup:
      #
      #   ttyd: invalid value for port: tcp://10.107.230.100:7681
      #
      # pi-server now also validates the value and fails with a readable error,
      # but leaving the links off is what keeps it working.
      enableServiceLinks: false
      # NO nodeSelector by default, on purpose.
      #
      # An earlier revision pinned kubernetes.io/arch: arm64 here, which is
      # silently fatal on every other architecture: the Pod sits Pending with
      # "didn't match Pod's node affinity/selector" and looks like a scheduling
      # or capacity problem. The published image is meant to be multi-arch, so
      # there is nothing to pin to.
      #
      # Single-arch builders: add a selector, or the scheduler may place the Pod
      # on a node whose architecture cannot run the image:
      #
      #   nodeSelector:
      #     kubernetes.io/arch: arm64
      #
      # Patches in kustomization.yaml are the tidier place for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Give the agent's running commands a chance to finish, but do not let a
      # wedged session hold the volume for ever.
      terminationGracePeriodSeconds: 30
      containers:
        - name: pi-cage
          image: ghcr.io/zmhhaha/pi-cage:latest
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: web
              containerPort: 7681
          env:
            - name: TZ
              value: UTC
            # --- why these two exist, and why the default was wrong here ---
            #
            # `serve` binds 127.0.0.1 by default and refuses a non-loopback bind
            # unless PI_CAGE_ALLOW_PUBLIC=1. That default is right for a bare
            # container. In this Deployment it made the Pod unreachable:
            #
            #   bind address .......... 127.0.0.1:7681  (/proc/net/tcp: 0100007F)
            #   reachable from itself .. yes  (ttyd answered 407 Proxy Auth Required)
            #   reachable from Pod IP .. no
            #   docker run -p .......... "Connection reset by peer"
            #
            # A Service DNATs to the Pod IP, and a loopback-only listener never
            # sees that traffic -- so the Service below had an endpoint that could
            # not accept a connection. Nothing verified this before: every check
            # inspected the container's properties and none tried to reach it.
            #
            # The boundary here is therefore NOT the bind address. It is the two
            # layers underneath, and both have to hold:
            #
            #   1. networkpolicy.yaml `proxy-ingress` admits only sources carrying
            #      the label pi-cage-client: "true" -- so only your proxy/ingress.
            #   2. PI_CAGE_AUTH_HEADER makes ttyd require that header on every
            #      request (an unauthenticated connection gets 407), and the proxy
            #      is the only thing that can set it.
            #
            # If you remove either layer, do not leave ALLOW_PUBLIC set.
            - name: PI_CAGE_BIND
              value: 0.0.0.0
            - name: PI_CAGE_ALLOW_PUBLIC
              value: "1"
            # Match this to what your proxy actually sends. Getting it wrong is a
            # silent failure that surfaces as a proxy error.
            #
            # X-Forwarded-Email is what oauth2-proxy sends upstream in
            # reverse-proxy mode, through --pass-user-headers, which is on by
            # default. Its --set-xauthrequest flag does something else: it sets
            # X-Auth-Request-User and X-Auth-Request-Email as *response* headers
            # for a fronting nginx in auth_request mode to read, and does not put
            # them on the request handed to the upstream.
            #
            # Choosing the wrong name produces: a successful login, an AuthSuccess
            # in the proxy log, then `407 Proxy Auth Required` from serve and
            # ERR_UNEXPECTED_PROXY_AUTH in the browser -- an error naming a proxy
            # problem for a header that never matched.
            #
            # Whatever you choose, the proxy must set or strip it. oauth2-proxy
            # strips client-supplied X-Forwarded-* by default
            # (--skip-auth-strip-headers); a bare nginx proxy_pass does not, so it
            # would have to overwrite the header explicitly.
            - name: PI_CAGE_AUTH_HEADER
              value: X-Forwarded-Email
          resources:
            # State these explicitly. Nothing in this manifest's target cluster
            # supplies a default quota.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/pi
            - name: workspace
              mountPath: /workspace
            # readOnlyRootFilesystem requires explicit writable paths. Do not
            # solve that by turning the read-only root off.
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          # These MUST be exec probes against loopback, not tcpSocket probes.
          #
          # A tcpSocket probe is opened by the kubelet against the POD IP, and
          # serve mode binds 127.0.0.1 only -- deliberately, because narrowing
          # the listener is half of "nothing reaches this except the proxy".
          # A tcpSocket probe therefore can never connect: the Pod runs forever
          # at 0/1 Ready and the Service never has an endpoint. Measured on a
          # real cluster, 2026-10-13.
          #
          # Node is guaranteed present, and this writes nothing, which matters
          # under readOnlyRootFilesystem. Loopback is the thing being probed, so
          # this is also the honest check: it tests what serve actually bound.
          #
          # Caveat, unchanged: this proves ttyd is listening, not that `pi` is
          # alive. If the agent exits, tmux can leave ttyd serving an empty
          # session. Check `tmux ls` when diagnosing; see README.
          startupProbe:
            exec:
              command: &loopback_probe
                - node
                - -e
                - |
                  const s = require('net').connect(7681, '127.0.0.1');
                  s.on('connect', () => { s.destroy(); process.exit(0); });
                  s.on('error', () => process.exit(1));
                  s.setTimeout(2000, () => { s.destroy(); process.exit(1); });
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: *loopback_probe
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: *loopback_probe
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: pi-cage-home
        - name: workspace
          persistentVolumeClaim:
            claimName: pi-cage-workspace
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pi-cage
  namespace: pi-cage
spec:
  selector:
    app: pi-cage
  ports:
    # Service port equals container port on purpose: whether an egress or
    # ingress policy matches before or after Service DNAT depends on the CNI,
    # and equal values make the rule correct either way.
    - name: web
      port: 7681
      targetPort: web
