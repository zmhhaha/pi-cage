# Hardened reference deployment.
#
# Read this file before changing it. Every hardening flag below is load-bearing,
# and what is DELIBERATELY ABSENT matters as much as what is present:
#
#   * No /var/run/docker.sock. pi-web mounts it on purpose; pi-cage never does.
#     A Docker socket is root-equivalent on the host.
#   * No host path bind mounts beyond the workspace you name yourself.
#   * No --privileged, no host networking, no added capabilities.
#
# There is deliberately NO `build:` key. `docker compose build` would take the
# base image and Pi version as plain tags and silently skip every architecture
# assertion and digest pin that build.sh performs. Build with ./build.sh; this
# file then consumes what it produced.
#
# Usage:
#   ./build.sh                                       # required first
#   docker compose run --rm pi-cage run "summarise this repository"
#   PI_CAGE_AUTH_HEADER= docker compose up -d         # loopback web terminal
#
# For anything beyond localhost, put an authenticating proxy in front and leave
# PI_CAGE_AUTH_HEADER at its default. See README.md and THREAT-MODEL.md.
#
# Note on the workspace bind mount: a bind mount keeps the HOST directory's
# ownership, so uid 10001 must be able to write it:
#
#   mkdir -p workspace && sudo chown 10001:10001 workspace
#
# (The named volume pi-home is unaffected: Docker copies the image's /home/pi
# ownership into a fresh named volume.)

services:
  pi-cage:
    # Whatever ./build.sh tagged. Override to verify a specific build:
    #   PI_CAGE_IMAGE=pi-cage:20261013T060112Z docker compose up -d
    image: ${PI_CAGE_IMAGE:-pi-cage:latest}
    command: ["serve"]

    # --- isolation ----------------------------------------------------------
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Docker applies its default seccomp profile; do not replace it with
    # unconfined.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=8m

    # --- persistent state ---------------------------------------------------
    volumes:
      # Pi configuration, credentials and session transcripts live here.
      # Back this up encrypted: it contains provider keys.
      - pi-home:/home/pi
      # The agent's working directory. Mount the narrowest path that works.
      - ./workspace:/workspace

    # --- network ------------------------------------------------------------
    # Loopback only. Removing the 127.0.0.1 prefix exposes a shell -- do not do
    # it without an authenticating proxy in front, and leave the header at its
    # default if you do.
    ports:
      - "127.0.0.1:7681:7681"

    environment:
      TZ: UTC
      # The proxy-supplied header stays ON by default, and is pass-through from
      # the shell so that `PI_CAGE_AUTH_HEADER= docker compose up -d` can turn
      # it off for loopback-only use. A literal value here would override the
      # shell and silently ignore that.
      #
      # `${VAR-default}` (no colon) is deliberate: it applies the default only
      # when the variable is UNSET, so an explicit empty value stays empty.
      PI_CAGE_AUTH_HEADER: "${PI_CAGE_AUTH_HEADER-X-Forwarded-Email}"

    # --- resources ----------------------------------------------------------
    # No cluster or daemon applies a default quota; state them explicitly.
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512

    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pi-home:
