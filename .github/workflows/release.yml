name: release

# Build both architectures in ONE manifest-list build, push, and attach an SBOM
# per architecture plus a signed provenance attestation.
#
# This is the repeatable form of what was done by hand for the first release:
# two single-arch builds on two hosts, assembled afterwards with
# `docker manifest create`. That worked and is recorded in
# docs/verification-log.md, but it is not a thing anyone should repeat.
#
# `./build.sh` is used rather than a bare `docker buildx` so the release goes
# through the same gates as every other build: the architecture assertion, the
# base image pinned to a manifest-list digest, the exact PI_PACKAGE check, and the
# SHA-256 verification of the ttyd asset.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (defaults to the ref name)"
        required: false

permissions:
  contents: write # create the release and upload assets
  packages: write # push to GHCR
  id-token: write # sign the provenance attestation

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE: pi-cage
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      NPM_REGISTRY: https://registry.npmjs.org
      PROVENANCE: "1"
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh records org.opencontainers.image.revision from this
          # checkout, so it has to be a real one.
          fetch-depth: 1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both architectures
        run: ./build.sh --multiarch

      - name: Record what was built
        id: built
        run: |
          {
            echo "## \`$TAG\`"
            echo
            echo "Multi-arch manifest list. The digest below is the index, not a"
            echo "single platform — pulling it resolves per architecture."
            echo
            echo '```'
            cat rendered/image.txt
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| base image | \`$(cat rendered/base-image.txt)\` |"
            echo "| Pi | \`$(cat rendered/pi-package.txt)\` |"
            echo "| platforms | \`$(cat rendered/platforms.txt)\` |"
            echo
            echo "An SBOM per architecture is attached. It covers the Debian packages,"
            echo "the npm tree and the Node runtime — **not \`ttyd\`**, which is a static"
            echo "binary with no cataloguer. See \`sbom/README.md\`."
          } > /tmp/notes.md
          echo "image=$REGISTRY/$IMAGE" >> "$GITHUB_OUTPUT"
          cat /tmp/notes.md

      - name: Resolve the per-platform digests
        id: dg
        run: |
          docker buildx imagetools inspect "$REGISTRY/$IMAGE:$TAG" --raw > /tmp/index.json
          AMD=$(jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest' /tmp/index.json)
          ARM=$(jq -r '.manifests[] | select(.platform.architecture=="arm64") | .digest' /tmp/index.json)
          [ -n "$AMD" ] && [ "$AMD" != "null" ] || { echo "no amd64 manifest in the index" >&2; exit 1; }
          [ -n "$ARM" ] && [ "$ARM" != "null" ] || { echo "no arm64 manifest in the index" >&2; exit 1; }
          echo "amd64=$AMD" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM" >> "$GITHUB_OUTPUT"

      - name: Generate an SBOM per architecture
        run: |
          set -eux
          IMAGE="${{ steps.built.outputs.image }}"
          mkdir -p sbom
          for pair in "amd64:${{ steps.dg.outputs.amd64 }}" "arm64:${{ steps.dg.outputs.arm64 }}"; do
            ARCH="${pair%%:*}"
            DIGEST="${pair#*:}"
            docker run --rm anchore/syft:latest \
              "registry:${IMAGE}@${DIGEST}" -o spdx-json > "/tmp/pi-cage-${ARCH}.spdx.json"
            gzip -9 -c "/tmp/pi-cage-${ARCH}.spdx.json" > "sbom/pi-cage-${ARCH}.spdx.json.gz"
            # Fail loudly rather than attaching an empty or truncated document.
            gzip -dc "sbom/pi-cage-${ARCH}.spdx.json.gz" | jq -e '.spdxVersion and (.packages | length > 100)' > /dev/null
          done
          ls -l sbom/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            sbom/pi-cage-amd64.spdx.json.gz \
            sbom/pi-cage-arm64.spdx.json.gz
